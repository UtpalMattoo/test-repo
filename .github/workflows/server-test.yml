# GitHub Actions Workflow: Run server tests for Flask backend
# This workflow runs tests automatically on code push, pull requests, and can be triggered manually.

name: Run server tests

on:
  # Run workflow when code is pushed to any branch (including main)
  push:
    branches:
      - main
      - '**'  # All branches
  # Run workflow when a pull request is opened or updated
  pull_request:
    branches:
      - main
      - '**'  # All branches
  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:  # Manual run

jobs:
  test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python (version 3.11)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Specify Python version

      # Step 3: Install Python dependencies from requirements.txt
      - name: Install dependencies
  # Install all dependencies listed in requirements.txt.
  # This guarantees that the test code runs in the same environment as the production code.
  # All packages needed by the app (such as Flask for the web server, SQLAlchemy for database access, etc.)
  # and by the tests (such as unittest, pytest, and mocking libraries like unittest.mock or pytest-mock) are installed together from requirements.txt.
  # This means any code—whether it's part of your main application or your test suite—will have access to the same set of dependencies.
  # This unified environment prevents errors caused by missing packages, ensures that tests accurately reflect real-world usage,
  # and makes your CI/CD pipeline more reliable and predictable.
  # This avoids issues where tests pass locally but fail in CI due to missing packages, and ensures consistency between development, testing, and production.
  #
  # Recommendation: For production deployments, consider separating test-only dependencies (like pytest, unittest, mocking libraries)
  # from application dependencies. You can use a separate requirements-dev.txt for development and testing, and only install
  # production dependencies in your deployment environment. This keeps your production environment lean and secure.
        run: |
          python -m pip install --upgrade pip  # Upgrade pip
          pip install -r server/requirements.txt  # Install all required packages for both app and tests

      # Step 4: Run the test suite using unittest
      - name: Run tests
        run: |
          python -m unittest -v server/test_app.py  # Run all tests in server/test_app.py with verbose output

