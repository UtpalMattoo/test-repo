#
# Create a GitHub Actions workflow that:
# - Runs server tests for a Flask backend
# - Triggers on push, pull request, and manual workflow_dispatch events
# - Sets up Python 3.11
# - Installs all dependencies from requirements.txt so both app and test code have the same environment
# - Explains in comments why requirements.txt is used for both app and test dependencies
# - Recommends separating test-only dependencies from production dependencies for deployment
# - Adds clear comments for each section and step so beginners can understand the workflow
